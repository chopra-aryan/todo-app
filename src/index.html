<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taskflow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <span class="logo-icon">✦</span>
          <span class="logo-text">Taskflow</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
          <span></span><span></span><span></span>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="project-list" id="projectList">
          <!-- Projects injected here -->
        </nav>
        <button class="btn-new-project" id="btnNewProject">
          <span class="plus">+</span> New Project
        </button>
      </div>

      <div class="sidebar-footer">
        <div class="task-summary" id="taskSummary">
          <div class="summary-item">
            <span class="summary-num" id="summaryTotal">0</span>
            <span class="summary-label">Total</span>
          </div>
          <div class="summary-item">
            <span class="summary-num" id="summaryDone">0</span>
            <span class="summary-label">Done</span>
          </div>
          <div class="summary-item">
            <span class="summary-num overdue" id="summaryOverdue">0</span>
            <span class="summary-label">Overdue</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main" id="main">

      <!-- Top bar -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="project-title" id="projectTitle">Select a project</h1>
          <span class="project-task-count" id="projectTaskCount"></span>
        </div>
        <div class="topbar-right">
          <div class="filter-bar">
            <select class="filter-select" id="filterPriority">
              <option value="all">All Priorities</option>
              <option value="high">High</option>
              <option value="medium">Medium</option>
              <option value="low">Low</option>
            </select>
            <select class="filter-select" id="filterStatus">
              <option value="all">All Status</option>
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <button class="btn-add-task" id="btnAddTask" disabled>
            <span>+</span> Add Task
          </button>
        </div>
      </header>

      <!-- Empty state -->
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">◎</div>
        <p class="empty-title">No project selected</p>
        <p class="empty-sub">Create or select a project from the sidebar to get started.</p>
      </div>

      <!-- Task board -->
      <div class="task-board" id="taskBoard">
        <!-- Task cards injected here -->
      </div>

    </main>
  </div>

  <!-- ── Modal: New / Edit Project ── -->
  <div class="modal-overlay" id="projectModalOverlay">
    <div class="modal" id="projectModal">
      <div class="modal-header">
        <h2 class="modal-title" id="projectModalTitle">New Project</h2>
        <button class="modal-close" id="projectModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label" for="projectNameInput">Project Name</label>
          <input class="field-input" type="text" id="projectNameInput" placeholder="e.g. Website Redesign" maxlength="60" />
        </div>
        <div class="field">
          <label class="field-label" for="projectColorInput">Accent Color</label>
          <div class="color-row" id="colorRow">
            <span class="color-dot active" data-color="#FF6B6B" style="background:#FF6B6B;"></span>
            <span class="color-dot" data-color="#FFA94D" style="background:#FFA94D;"></span>
            <span class="color-dot" data-color="#FFD43B" style="background:#FFD43B;"></span>
            <span class="color-dot" data-color="#69DB7C" style="background:#69DB7C;"></span>
            <span class="color-dot" data-color="#4DABF7" style="background:#4DABF7;"></span>
            <span class="color-dot" data-color="#CC5DE8" style="background:#CC5DE8;"></span>
            <span class="color-dot" data-color="#F06595" style="background:#F06595;"></span>
            <span class="color-dot" data-color="#A9E34B" style="background:#A9E34B;"></span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="projectModalCancel">Cancel</button>
        <button class="btn-confirm" id="projectModalConfirm">Create Project</button>
      </div>
    </div>
  </div>

  <!-- ── Modal: New / Edit Task ── -->
  <div class="modal-overlay" id="taskModalOverlay">
    <div class="modal modal-lg" id="taskModal">
      <div class="modal-header">
        <h2 class="modal-title" id="taskModalTitle">New Task</h2>
        <button class="modal-close" id="taskModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label" for="taskTitle">Title <span class="required">*</span></label>
          <input class="field-input" type="text" id="taskTitle" placeholder="What needs to be done?" maxlength="100" />
        </div>
        <div class="field">
          <label class="field-label" for="taskDesc">Description</label>
          <textarea class="field-input field-textarea" id="taskDesc" placeholder="Add more details…" rows="3"></textarea>
        </div>
        <div class="field-row">
          <div class="field">
            <label class="field-label" for="taskDueDate">Due Date</label>
            <input class="field-input" type="date" id="taskDueDate" />
          </div>
          <div class="field">
            <label class="field-label" for="taskPriority">Priority</label>
            <select class="field-input field-select" id="taskPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="taskNotes">Notes</label>
          <textarea class="field-input field-textarea" id="taskNotes" placeholder="Any extra notes, links, references…" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="taskModalCancel">Cancel</button>
        <button class="btn-confirm" id="taskModalConfirm">Add Task</button>
      </div>
    </div>
  </div>

  <!-- ── Modal: Task Detail / View ── -->
  <div class="modal-overlay" id="detailModalOverlay">
    <div class="modal modal-lg" id="detailModal">
      <div class="modal-header">
        <div class="detail-badges" id="detailBadges"></div>
        <button class="modal-close" id="detailModalClose">✕</button>
      </div>
      <div class="modal-body">
        <h2 class="detail-title" id="detailTitle"></h2>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-section" id="detailDescSection">
          <div class="detail-section-label">Description</div>
          <div class="detail-section-body" id="detailDesc"></div>
        </div>
        <div class="detail-section" id="detailNotesSection">
          <div class="detail-section-label">Notes</div>
          <div class="detail-section-body" id="detailNotes"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="detailModalClose2">Close</button>
        <button class="btn-secondary" id="detailEditBtn">Edit Task</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</body>
</html>
